<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Pro - Card Counter & Basic Strategy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Blackjack Pro</h1>
        </header>

        <main>
            <!-- SECTION 1: BASIC STRATEGY (Visual Table) -->
            <section class="basic-strategy panel">
                <h2>Basic Strategy Simulator</h2>
                <p class="subtitle">Click the empty slots to place the dealt cards</p>
                
                <div class="blackjack-table">
                    <!-- Dealer Side -->
                    <div class="dealer-area">
                        <div class="table-label">Dealer's Hand</div>
                        <div class="card-slots">
                            <div class="card-slot static-back">
                                <img src="Playing Cards/red_card_back.png" alt="Card Back">
                            </div>
                            <div class="card-slot interactive-slot" id="dealer-slot" data-role="dealer" onclick="openCardSelector('dealer')">
                                <span class="plus-icon">+</span>
                                <img src="" alt="" class="selected-card-img" style="display: none;">
                            </div>
                        </div>
                    </div>

                    <!-- Player Side -->
                    <div class="player-area">
                        <div class="table-label">Your Hand</div>
                        <div class="card-slots">
                            <div class="card-slot interactive-slot" id="player-slot-1" data-role="player1" onclick="openCardSelector('player1')">
                                <span class="plus-icon">+</span>
                                <img src="" alt="" class="selected-card-img" style="display: none;">
                            </div>
                            <div class="card-slot interactive-slot" id="player-slot-2" data-role="player2" onclick="openCardSelector('player2')">
                                <span class="plus-icon">+</span>
                                <img src="" alt="" class="selected-card-img" style="display: none;">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-box">
                    <span class="label">Recommended Action:</span>
                    <span class="action-result" id="action-result">Waiting for cards...</span>
                </div>
            </section>

            <!-- SECTION 2: CARD COUNTER (Merged with Settings) -->
            <section class="card-counter panel">
                <div class="counter-header">
                    <div class="titles">
                        <h2>Card Counter (Hi-Lo)</h2>
                        <p class="subtitle">Click the cards as they are dealt</p>
                    </div>
                    <div class="settings">
                        <label for="decks">Decks:</label>
                        <input type="number" id="decks" value="6" min="1" max="8">
                        <button id="reset-btn">Reset Shoe</button>
                    </div>
                </div>
                
                <div class="card-grid">
                    <!-- Low Cards (+1) -->
                    <button class="card-btn low" data-val="2">2 <span class="badge"></span></button>
                    <button class="card-btn low" data-val="3">3 <span class="badge"></span></button>
                    <button class="card-btn low" data-val="4">4 <span class="badge"></span></button>
                    <button class="card-btn low" data-val="5">5 <span class="badge"></span></button>
                    <button class="card-btn low" data-val="6">6 <span class="badge"></span></button>
                    
                    <!-- Neutral Cards (0) -->
                    <button class="card-btn neutral" data-val="7">7 <span class="badge"></span></button>
                    <button class="card-btn neutral" data-val="8">8 <span class="badge"></span></button>
                    <button class="card-btn neutral" data-val="9">9 <span class="badge"></span></button>
                    
                    <!-- High Cards (-1) -->
                    <button class="card-btn high" data-val="10">10 <span class="badge"></span></button>
                    <button class="card-btn high" data-val="J">J <span class="badge"></span></button>
                    <button class="card-btn high" data-val="Q">Q <span class="badge"></span></button>
                    <button class="card-btn high" data-val="K">K <span class="badge"></span></button>
                    <button class="card-btn high" data-val="A">A <span class="badge"></span></button>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="label">Running Count</span>
                        <span class="value" id="running-count">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">True Count</span>
                        <span class="value highlight" id="true-count">0.00</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Cards Left</span>
                        <span class="value" id="cards-left">312</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL FOR CARD SELECTION -->
    <div id="card-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3>Select Suit</h3>
            <div class="suit-selector">
                <button onclick="showCards('Hearts')">♥ Hearts</button>
                <button onclick="showCards('Diamonds')">♦ Diamonds</button>
                <button onclick="showCards('Clubs')">♣ Clubs</button>
                <button onclick="showCards('Spades')">♠ Spades</button>
            </div>
            
            <div id="card-picker-grid" class="card-picker-grid" style="display: none;">
                <!-- Cards will be injected here by JS -->
            </div>
            <button id="back-to-suits" style="display: none;" onclick="resetModalToSuits()">Back to Suits</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
